<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISAT Position Trading Dashboard</title>
  <meta name="description" content="Dashboard pribadi position trading PT Indosat Tbk (ISAT.JK) dengan strategi piramida terbalik 4 termin.">
  <style>
    /* ────────────────────────────────────────────── */
    /* CSS Variables & Reset                          */
    /* ────────────────────────────────────────────── */
    :root {
      --bg-primary: #0f0f1a;
      --bg-secondary: #1a1a2e;
      --bg-card: #16213e;
      --bg-input: #0f3460;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0b0;
      --text-muted: #6b7280;
      --accent-green: #00d4aa;
      --accent-red: #ff4757;
      --accent-yellow: #eab308;
      --accent-purple: #a855f7;
      --accent-blue: #3b82f6;
      --border: #2a2a4a;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ────────────────────────────────────────────── */
    /* Layout                                         */
    /* ────────────────────────────────────────────── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
      .container { padding: 12px; }
    }

    /* ────────────────────────────────────────────── */
    /* Header                                         */
    /* ────────────────────────────────────────────── */
    #header-price {
      background: linear-gradient(135deg, var(--bg-secondary), var(--bg-card));
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stock-symbol {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent-green);
      letter-spacing: 1px;
    }

    .stock-company {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .badge-open {
      background: rgba(0, 212, 170, 0.15);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
    }

    .badge-closed {
      background: rgba(107, 114, 128, 0.15);
      color: var(--text-muted);
      border: 1px solid var(--text-muted);
    }

    .timestamp {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
    }

    .current-price {
      font-size: 2.5rem;
      font-weight: 800;
    }

    .price-change {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .price-change.positive { color: var(--accent-green); }
    .price-change.negative { color: var(--accent-red); }

    /* ────────────────────────────────────────────── */
    /* Phase Banner                                   */
    /* ────────────────────────────────────────────── */
    #phase-banner {
      background: var(--bg-card);
      border-left: 5px solid var(--accent-green);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .phase-label {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .phase-desc {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    /* ────────────────────────────────────────────── */
    /* Cards                                          */
    /* ────────────────────────────────────────────── */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    /* ────────────────────────────────────────────── */
    /* Indicators Grid                                */
    /* ────────────────────────────────────────────── */
    #indicators-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .indicator-card {
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .indicator-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .indicator-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .indicator-sub {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    /* ────────────────────────────────────────────── */
    /* Accumulation Panel                             */
    /* ────────────────────────────────────────────── */
    .acc-signal {
      font-size: 1.1rem;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .acc-score {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .acc-bar {
      height: 8px;
      background: var(--bg-secondary);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .acc-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .acc-note {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* ────────────────────────────────────────────── */
    /* Calculator                                     */
    /* ────────────────────────────────────────────── */
    .calc-strategy-info {
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .strat-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--border);
    }

    .strat-row:last-child { border-bottom: none; }
    .strat-row span { color: var(--text-secondary); }
    .strat-row.highlight {
      background: rgba(0, 212, 170, 0.08);
      margin: 6px -16px -6px;
      padding: 10px 16px;
      border-radius: 0 0 8px 8px;
    }
    .strat-row.highlight strong { color: var(--accent-green); }

    .termins-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .termin-card {
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 16px;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }

    .termin-card.bought {
      border-color: var(--accent-green);
      background: rgba(0, 212, 170, 0.05);
    }

    .termin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .termin-check {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .termin-check input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent-green);
      cursor: pointer;
    }

    .termin-label {
      font-weight: 700;
      font-size: 1rem;
    }

    .termin-status {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .termin-card.bought .termin-status {
      color: var(--accent-green);
      font-weight: 600;
    }

    .termin-rationale {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .termin-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    @media (max-width: 480px) {
      .termin-inputs { grid-template-columns: 1fr; }
    }

    .input-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .input-group input {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-weight: 600;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--accent-green);
    }

    .input-group .disabled-input {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .termin-result {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.85rem;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .termin-result div {
      flex: 1;
      min-width: 120px;
    }

    .termin-result span {
      color: var(--text-muted);
      display: block;
      font-size: 0.75rem;
      margin-bottom: 2px;
    }

    .termin-result strong {
      color: var(--text-primary);
    }

    /* ────────────────────────────────────────────── */
    /* Summary Card                                   */
    /* ────────────────────────────────────────────── */
    .summary-card {
      background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid var(--border);
    }

    .summary-card h3 {
      margin-bottom: 16px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .summary-item {
      background: var(--bg-primary);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .summary-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .summary-value {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .summary-value.safe {
      color: var(--accent-green);
    }

    .allocation-bar {
      margin-bottom: 20px;
    }

    .allocation-bar-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .allocation-bar-track {
      height: 10px;
      background: var(--bg-primary);
      border-radius: 5px;
      overflow: hidden;
    }

    .allocation-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
      border-radius: 5px;
      transition: width 0.5s ease;
    }

    .projection-section h4 {
      margin: 16px 0 10px;
      font-size: 1rem;
      color: var(--text-primary);
    }

    .projection-grid, .dividend-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }

    .proj-label, .div-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .proj-value, .div-value {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .proj-value.positive { color: var(--accent-green); }

    .div-card {
      background: var(--bg-primary);
      padding: 12px;
      border-radius: 8px;
      border-left: 3px solid;
    }

    .div-card.conservative { border-color: var(--accent-yellow); }
    .div-card.optimistic { border-color: var(--accent-green); }

    .div-yield {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .empty-projection {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* ────────────────────────────────────────────── */
    /* Checklist                                      */
    /* ────────────────────────────────────────────── */
    .checklist-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      background: var(--bg-secondary);
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }

    .checklist-item:hover {
      border-color: var(--accent-green);
    }

    .checklist-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent-green);
      margin-top: 2px;
      flex-shrink: 0;
    }

    .checklist-text {
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .checklist-banner {
      padding: 16px;
      border-radius: 8px;
      font-weight: 700;
      text-align: center;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .checklist-banner.green {
      background: rgba(0, 212, 170, 0.15);
      color: var(--accent-green);
      border: 2px solid var(--accent-green);
    }

    .checklist-banner.red {
      background: rgba(255, 71, 87, 0.1);
      color: var(--accent-red);
      border: 2px solid var(--accent-red);
    }

    /* ────────────────────────────────────────────── */
    /* Sentiment Panel                                */
    /* ────────────────────────────────────────────── */
    .sentiment-section {
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .sentiment-section.negative {
      background: rgba(255, 71, 87, 0.06);
      border-left: 3px solid var(--accent-red);
    }

    .sentiment-section.positive {
      background: rgba(0, 212, 170, 0.06);
      border-left: 3px solid var(--accent-green);
    }

    .sentiment-section h4 {
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .sentiment-section ul {
      list-style: none;
      padding: 0;
    }

    .sentiment-section li {
      font-size: 0.85rem;
      color: var(--text-secondary);
      padding: 4px 0;
      padding-left: 16px;
      position: relative;
    }

    .sentiment-section li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--text-muted);
    }

    /* ────────────────────────────────────────────── */
    /* TradingView Widget                             */
    /* ────────────────────────────────────────────── */
    .tradingview-wrapper {
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    #tradingview_chart {
      height: 500px;
    }

    /* ────────────────────────────────────────────── */
    /* Error                                          */
    /* ────────────────────────────────────────────── */
    .error-message {
      text-align: center;
      padding: 40px 20px;
    }

    .error-message h2 {
      color: var(--accent-red);
      margin-bottom: 12px;
    }

    .error-message code {
      background: var(--bg-secondary);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .error-message button {
      margin-top: 16px;
      padding: 10px 24px;
      background: var(--accent-green);
      color: var(--bg-primary);
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
    }

    /* ────────────────────────────────────────────── */
    /* Footer                                         */
    /* ────────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 30px 20px;
      color: var(--text-muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }

    footer a {
      color: var(--accent-blue);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Header Harga -->
    <div id="header-price">
      <p style="color: var(--text-muted);">Memuat data...</p>
    </div>

    <!-- Phase Banner -->
    <div id="phase-banner"></div>

    <!-- TradingView Chart -->
    <div class="tradingview-wrapper">
      <div id="tradingview_chart"></div>
    </div>

    <!-- Grid 2 Kolom -->
    <div class="grid-2">

      <!-- Kolom Kiri -->
      <div>
        <!-- Indikator Teknikal -->
        <div class="card">
          <h3>📊 Indikator Teknikal</h3>
          <div id="indicators-grid"></div>
        </div>

        <!-- Deteksi Akumulasi -->
        <div class="card">
          <div id="accumulation-panel"></div>
        </div>

        <!-- Sentimen -->
        <div class="card">
          <div id="sentiment-panel"></div>
        </div>
      </div>

      <!-- Kolom Kanan -->
      <div>
        <!-- Kalkulator Piramida -->
        <div class="card">
          <h3>🧮 Kalkulator Piramida 4 Termin</h3>
          <div id="calculator">
            <p style="color: var(--text-muted);">Memuat kalkulator...</p>
          </div>
        </div>

        <!-- Checklist -->
        <div class="card">
          <div id="checklist"></div>
        </div>
      </div>

    </div>

    <footer>
      <p>Dashboard pribadi — bukan rekomendasi investasi. Data dari <a href="https://finance.yahoo.com" target="_blank">Yahoo Finance</a> via yfinance.</p>
      <p>Update otomatis via GitHub Actions (09:35, 12:05, 16:15 WIB).</p>
    </footer>

  </div>

  <script type="module" src="dist/app.js"></script>
</body>
</html>
